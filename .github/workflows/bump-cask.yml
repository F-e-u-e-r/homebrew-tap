# Tap-local auto-bump for the ai-pet-usage cask, using THIS repo's own GITHUB_TOKEN (no cross-repo token).
# The procedure lives in scripts/bump-cask.sh (tested end-to-end by scripts/test-bump.sh); summary:
#
# Selection (scripts/select-release.jq; contract = docs/release/VERSIONING.md in F-e-u-e-r/ai-pet-usage):
# the highest canonical release whose channel is beta, rc or stable (alpha excluded), by canonical semantic
# ordering — never publication time or string order. Legacy alpha-v* tags are never selected; with no
# eligible canonical release the cask is left unchanged (no fallback).
# Candidates: every non-draft release, listed with a bound of 1000 (`gh release list --limit 1001`: a listing
# over the bound is known to be incomplete and fails the run — the bound the app's release workflow also uses).
# The release must carry exactly one matching asset with a well-formed
# "sha256:<hex>" API digest (scripts/release-asset.sh) — validated before any shortcut — and the download
# must match it (scripts/verify-asset.sh). version, sha256 and url are rewritten together
# (scripts/update-cask.sh, which also checks the cask with `ruby -c`), so the first canonical bump also
# migrates the legacy alpha-v#{version} URL. Nothing is downloaded or committed when the cask is current.
name: bump-cask
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cask to the highest eligible canonical ai-pet-usage release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/bump-cask.sh
